version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: docuai_postgres
    restart: always
    environment:
      POSTGRES_USER: docuai_user
      POSTGRES_PASSWORD: docuai_password
      POSTGRES_DB: docuai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docuai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: docuai_minio
    restart: always
    environment:
      MINIO_ROOT_USER: docuai_minio_user
      MINIO_ROOT_PASSWORD: docuai_minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: docuai_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./apps/api:/app/api
      - ./packages:/app/packages

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: docuai_worker
    restart: always
    env_file:
      - .env
    depends_on:
      - api
      - redis
      - postgres
    volumes:
      - ./apps/worker:/app/worker
      - ./packages:/app/packages

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: docuai_web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./apps/web:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:
